
name: Web E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Executando os testes
      run: npx cypress run --reporter junit --reporter-options "mochaFile=results/test-results.xml"

    - name: Salvar resultados dos testes
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: results/test-results.xml
